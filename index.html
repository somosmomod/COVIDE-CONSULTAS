<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COVIDE · Consultas</title>
<meta name="theme-color" content="#2641D9">
<meta name="description" content="Consultá el Reglamento de Convivencia y el Estatuto de la cooperativa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2641D9"/><path d="M16 6 5.5 15H9v10h14V15h3.5z" fill="#FFC83D"/><rect x="14" y="18" width="4" height="7" fill="#2641D9"/></svg>
    <div><b>COVIDE</b><span>Consultas de la cooperativa</span></div>
  </div>
  <button id="inst" class="ghost" hidden>Instalar</button>
  <button id="theme" class="ghost" aria-label="Cambiar entre tema claro y oscuro">◐</button>
</header>
<nav class="seg main" aria-label="Secciones">
  <button data-v="chat" aria-pressed="true">Consultar</button>
  <button data-v="docs" aria-pressed="false">Documentos</button>
</nav>
<main id="scroll"><div class="wrap">
  <section id="vchat">
    <div id="hero">
      <h1>¿Qué querés saber de la cooperativa?</h1>
      <p>Escribí tu pregunta y te mostramos qué dicen el Reglamento de Convivencia y el Estatuto, con el artículo.</p>
      <div id="chips"></div>
    </div>
    <div id="chat"></div>
  </section>
  <section id="vdocs" hidden>
    <div class="seg dsel" style="margin:8px 0"><button data-d="reg" aria-pressed="true">Reglamento de Convivencia</button><button data-d="est" aria-pressed="false">Estatuto</button></div>
    <div id="fltbar"><input id="flt" type="search" placeholder="Buscar una palabra en este documento" aria-label="Buscar en el documento"></div>
    <div id="dlist"></div>
  </section>
</div></main>
<form id="f" autocomplete="off">
  <input id="q" type="text" placeholder="Escribí tu consulta…" aria-label="Tu consulta" enterkeyhint="send">
  <button id="go" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>
<p class="fine">Orientativo. Ante dudas, consultá al Consejo Directivo.</p>
<script src="config.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
</body></html>
